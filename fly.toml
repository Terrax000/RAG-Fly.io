# fly.toml app configuration file generated for rag-fly-io on 2025-12-14T16:40:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rag-fly-io'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[env]
  SERVER_ADDRESS = "0.0.0.0"
  SERVER_PORT = "8080"
  JAVA_TOOL_OPTIONS = "-Dserver.address=0.0.0.0 -Dserver.port=8080"

  
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
