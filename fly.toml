# fly.toml app configuration file generated for rag-fly-io on 2025-12-14T16:40:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rag-fly-io'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  
  

[env]
  SERVER_ADDRESS = "0.0.0.0"
  SERVER_PORT = "8080"
  SPRING_APPLICATION_JSON = "{\"server\":{\"address\":\"0.0.0.0\",\"port\":8080}}"

[[http_service.checks]]
  grace_period = "90s"
  interval = "10s"
  timeout = "2s"
  method = "GET"
  path = "/"
  
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
