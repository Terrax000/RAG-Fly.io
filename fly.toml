app = "rag-fly-io"
primary_region = "cdg"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "java -jar /app.jar --server.address=0.0.0.0 --server.port=8080"

[env]
  PORT = "8080"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
